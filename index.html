<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Portfolio - En Construction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #f0f0f0;
            text-align: center;
            padding: 50px;
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: #1e1e1e;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            padding: 30px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #ffffff;
        }

        p {
            color: #cccccc;
            font-size: 1.2em;
        }

        .countdown {
            font-size: 2.5em;
            margin-top: 20px;
            color: #ff6347;
        }

        .footer {
            margin-top: 30px;
            font-size: 1em;
            color: #cccccc;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Mon Portfolio est en Construction</h1>
        <p>Merci de votre patience ! Mon portfolio sera disponible le <strong>31 août</strong>.</p>
        
        <div id="countdown" class="countdown">
            Chargement du compteur...
        </div>
        
        <div class="footer">
            <p>Suivez-moi sur mes réseaux sociaux pour plus de mises à jour !</p>
        </div>
    </div>

    <script>
        // Date de lancement (31 août)
        var targetDate = new Date("Aug 31, 2025 00:00:00").getTime();

        var countdownFunction = setInterval(function() {
            var now = new Date().getTime();
            var timeLeft = targetDate - now;

            // Calcul des jours, heures, minutes et secondes
            var days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            var hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            // Affichage du temps restant
            document.getElementById("countdown").innerHTML = days + " jours " + hours + " heures " + minutes + " minutes " + seconds + " secondes";

            // Si le compte à rebours est terminé, afficher un message
            if (timeLeft < 0) {
                clearInterval(countdownFunction);
                document.getElementById("countdown").innerHTML = "Le portfolio est maintenant disponible !";
            }
        }, 1000);
    </script>

</body>
</html>
